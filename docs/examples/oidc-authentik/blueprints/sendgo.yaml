# Authentik blueprint: OAuth2 provider + application for sendgo.
# Applied automatically by the authentik worker on startup (mounted into
# /blueprints/custom). Values must match the sendgo OIDC_* env vars in
# docker-compose.yml.
version: 1
metadata:
  name: sendgo-oidc
entries:
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: sendgo
    id: provider
    attrs:
      client_type: confidential
      client_id: sendgo
      client_secret: sendgo-demo-client-secret
      # go-oidc accepts RS256 only — sign with the built-in self-signed key.
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      # default-invalidation-flow ends the WHOLE authentik SSO session on
      # sign-out, so "Sign out" in sendgo behaves the way users expect. The
      # UI-wizard default (default-provider-invalidation-flow) only shows a
      # "logged out of application" page and keeps the SSO session alive —
      # revisiting sendgo would silently log you back in.
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      # Scope mappings are pre-selected in the admin-UI wizard but NOT applied
      # by default when creating via API/blueprint — without them the id_token
      # carries no email/name claims.
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:1443/oidc/callback
  - model: authentik_core.application
    state: present
    identifiers:
      slug: sendgo
    attrs:
      name: sendgo
      provider: !KeyOf provider
